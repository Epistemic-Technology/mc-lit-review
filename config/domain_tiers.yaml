suffix_rules:            # applied after the explicit list; first match wins
  - {suffix: ".edu", tier: academic}
  - {suffix: ".ac.uk", tier: academic}
  - {suffix: ".gov", tier: government}
  - {suffix: ".gov.uk", tier: government}
  - {suffix: ".europa.eu", tier: government}

ignore:
  - unsplash.com
  - substackcdn.com
  - imgur.com
  - giphy.com
  - pexels.com
  - bit.ly
  - tinyurl.com
  - google.com           # generic search/docs/drive links; Google products are not citable works
  - docs.google.com
  - drive.google.com
  - apple.com
  - archive.ph           # a mirror of something else; the mirrored source is unknown
  - web.archive.org
  - patreon.com
  - buymeacoffee.com
  - ko-fi.com
  - paypal.com
  - stripe.com
  - eventbrite.com
  - lu.ma
  - meetup.com
  - zoom.us
  - calendly.com
  - forms.gle
  - typeform.com
  - mailchi.mp
  - substack.com         # platform pages (subscribe, notes); posts are handled by kind
  - open.substack.com
