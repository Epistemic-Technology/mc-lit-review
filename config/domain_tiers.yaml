# Source tiers for cited works (docs/plan.md stage 4). Tier is decided by reference kind first
# (arxiv/doi -> academic, book -> book, wikipedia -> encyclopedia, substack_post/homepage -> substack),
# then by registered domain below, then by suffix rules, else "web".
# Domains in `ignore` are dropped from source analyses (images, link shorteners, platform chrome).

