# Query bank. Each term is tagged with a facet so we can report which facets recruited which posts.
# Terms are also used, case-insensitively, as the loose keyword screen for publications.
# Variants generated per term (see settings.phase1.brave.variants):
#   site_quoted:  site:substack.com "<term>"
#   site_plain:   site:substack.com <term>          (multi-word terms only)
#   open_quoted:  "<term>" substack                  (reaches custom-domain publications)
# Substack's own search gets the bare term.
