# Named people counted by text mention in relevant posts (docs/plan.md stage 4). Each entry has a display name,
# a group, and the regexes that count as a mention (case-sensitive; surnames alone only where unambiguous).
# A post counts once per person however many times the name appears. `wikipedia` is the English Wikipedia article
# title the site links the name to; omitted where the person has no article (checked 2026-10-09). Where Wikipedia
# itself redirects the name to another article (Blake Lemoine -> LaMDA, Scott Alexander -> Slate Star Codex) we link there.

