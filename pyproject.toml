[project]
name = "mcreview"
version = "0.1.0"
description = "Wide-net corpus builder for machine cognition / machine consciousness writing on Substack"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "selectolax>=0.3",
    "pypdf>=5.0",                 # metadata titles for cited PDFs (titles.py)
    "anthropic>=1.9.0",
    "pydantic>=2.13.5",
    "torch>=2.4",                 # direct dependency so [tool.uv.sources] can pin it to the CPU index
    "sentence-transformers>=6.1.0",
    "umap-learn>=0.5.12",
    "hdbscan>=0.8.44",
    "python-igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "altair>=6.3.0",
    "pandas>=3.0.6",
    "vl-convert-python>=1.9.0.post1",
]

[project.scripts]
mcreview = "mcreview.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcreview"]

[dependency-groups]
dev = ["pytest>=8"]

# No GPU on the analysis machine: take PyTorch from the CPU-only index (a ~200 MB wheel instead of the
# multi-GB CUDA build). sentence-transformers pulls torch in.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
